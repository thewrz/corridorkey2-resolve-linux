[project]
name = "corridorkey-resolve"
version = "0.1.0"
description = "Local CorridorKey 2.0 inference bridge for Resolve OpenFX"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.13.0", "torchvision==0.28.0", "numpy==1.26.4",
  "opencv-python-headless==4.11.0.86", "transformers>=5.10,<6",
  "timm>=1.0", "safetensors>=0.6", "huggingface-hub>=1,<3",
  "einops>=0.8", "scipy>=1.16", "pillow>=12", "tqdm>=4.67",
  "utils3d @ git+https://github.com/EasternJournalist/utils3d.git@83bfa5bda008803f6521ce9547f94023b8afeddd",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14", "pip-audit>=2.9"]

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
exclude = [".deps", "vendor"]
